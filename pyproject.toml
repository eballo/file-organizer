[project]
name = "file-organizer"
version = "0.1.0"
description = "Multimedia Organizer Tool"
readme = "readme.md"
requires-python = ">=3.13"
dependencies = [
    "pillow>=12.3.0",
    "tqdm>=4.70.1",
    "comtypes>=1.4.17; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "black>=26.5.1",
    "flake8>=7.4.0",
    "coverage>=7.16.1",
    "pre-commit>=4.6.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.black]
line-length = 120

[tool.coverage.run]
source = ["src"]
omit = [
    "gen/*",
    "tests/*",
]
